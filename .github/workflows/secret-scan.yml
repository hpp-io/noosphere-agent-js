name: secret-scan

# Fail the build if a real secret reaches a PR or main. Runs gitleaks over the
# full git history via the official Docker image (no org license needed, unlike
# the marketplace action). Known Anvil/Foundry dev keys are allowlisted in
# .gitleaks.toml so only genuine secrets trip the gate.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for a complete scan
      - name: gitleaks (git history + working tree)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
