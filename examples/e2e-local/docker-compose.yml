# Local e2e stage — run the paid-compute containers on localhost before any
# server deployment. Quality battery: python3 quality.py
services:
  hf-stt:
    image: example-hf-stt-noosphere:local
    container_name: local-hf-stt
    ports:
      - "127.0.0.1:8095:8095"
    mem_limit: 4g
    environment:
      # local harness only — lets the battery serve samples from the docker host
      STT_ALLOW_PRIVATE_URLS: "1"

  hf-tts:
    image: example-hf-tts-noosphere:local
    container_name: local-hf-tts
    ports:
      - "127.0.0.1:8096:8096"
    mem_limit: 8g
